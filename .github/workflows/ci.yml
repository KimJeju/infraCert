name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,winrm]" pypdf
      - name: manifest drift (regen must be a no-op)
        run: |
          python scripts/regen_manifest.py rulepacks/kisa-2026
          git diff --exit-code -- rulepacks/
      - name: pytest (+ rule fixture coverage)
        env:
          QT_QPA_PLATFORM: offscreen
          IG_RULE_COVERAGE: workspace/rule_coverage.json
        run: python -m pytest -q
      - name: rule coverage table
        env:
          PYTHONUTF8: "1"
        run: python scripts/rule_coverage.py --json workspace/rule_coverage.json
