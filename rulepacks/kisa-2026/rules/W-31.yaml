# W-31 SNMP Access Control 설정 — Windows 선언형 룰(PowerShell 조회 전용). 생성: scripts/gen_rules_windows.py
id: W-31
name: SNMP Access Control 설정
severity: 중
category: 서비스관리
platforms:
- windows
shell: powershell
collect:
- key: svc
  cmd: Get-Service -Name SNMP -ErrorAction SilentlyContinue | Where-Object {$_.Status -eq 'Running'} | Select-Object -ExpandProperty Name
  timeout: 60
- key: mgr
  cmd: (Get-Item -LiteralPath 'HKLM:\SYSTEM\CurrentControlSet\Services\SNMP\Parameters\PermittedManagers' -ErrorAction SilentlyContinue).Property
  timeout: 60
verdict:
- when:
    svc:
      absent: true
  then: GOOD
- when:
    mgr:
      exists: true
  then: GOOD
- else: VULN
evidence:
- svc
- mgr
note: PermittedManagers 에 허용 호스트가 있어야 양호
