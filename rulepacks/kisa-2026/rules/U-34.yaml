# U-34 Finger 서비스 비활성화 — 선언형 룰(gen_rules_services.py 생성). 명령은 상수, 판정은 화이트리스트 연산자만.
id: U-34
name: Finger 서비스 비활성화
severity: 상
category: 서비스관리
platforms:
- linux
- aix
- solaris
- hpux
collect:
- key: found
  cmd: 'grep -E ''^[[:space:]]*finger[[:space:]]'' /etc/inetd.conf 2>/dev/null | sed ''s/^/inetd: /''; [ -f /etc/xinetd.d/finger ] && grep -iqE ''disable[[:space:]]*=[[:space:]]*no'' /etc/xinetd.d/finger && echo ''xinetd:
    finger enabled''; systemctl is-active finger finger.socket 2>/dev/null | grep -x active | sed ''s/^/systemd: finger /''; ps -e -o comm= 2>/dev/null | grep -xE ''(fingerd|in.fingerd)'' | sort -u | sed ''s/^/proc: /'''
  timeout: 60
extract:
- from: found
  lines: n
verdict:
- when:
    found_ok:
      eq: 'False'
    n:
      eq: 0
  then: MANUAL
- when:
    n:
      eq: 0
  then: GOOD
- else: VULN
evidence:
- found
note: finger 서비스가 inetd/xinetd/프로세스 어디서든 활성이면 취약
remediation: Finger 서비스 비활성화 설정
