# W-52 Autologon 기능 제어 — Windows 선언형 룰(PowerShell 조회 전용). 생성: scripts/gen_rules_windows.py
id: W-52
name: Autologon 기능 제어
severity: 상
category: 보안관리
platforms:
- windows
shell: powershell
collect:
- key: v
  cmd: (Get-ItemProperty -LiteralPath 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon' -Name 'AutoAdminLogon' -ErrorAction SilentlyContinue).'AutoAdminLogon'
  timeout: 60
verdict:
- when:
    v:
      eq: '1'
  then: VULN
- else: GOOD
evidence:
- v
