# N-18 SNMP Community String 복잡성 설정 — Cisco IOS + Junos variant 선언형 룰(show 명령 전용). 생성: scripts/gen_rules_netdev.py
id: N-18
name: SNMP Community String 복잡성 설정
severity: 상
category: 기능관리
platforms:
- cisco-ios
shell: raw
collect:
- key: cfg
  cmd: show running-config
  timeout: 60
- key: ev
  cmd: show running-config | include ^snmp-server community
  timeout: 60
verdict:
- when:
    cfg:
      regex: (?mi)^snmp-server community (public|private)\b
  then: VULN
- when:
    cfg:
      regex: (?m)^snmp-server community (?=\S{8,})(?=\S*[A-Za-z])(?=\S*\d)(?=\S*[^A-Za-z0-9\s])\S+
  then: GOOD
- when:
    cfg:
      regex: (?m)^snmp-server community
  then: VULN
- else: GOOD
evidence:
- ev
note: public/private 취약. 8자 이상·영문+숫자+특수문자면 양호
variants:
- platforms:
  - junos
  shell: raw
  collect:
  - key: cfg
    cmd: show configuration | display set
    timeout: 60
  - key: ev
    cmd: show configuration | display set | match "snmp community"
    timeout: 60
  verdict:
  - when:
      cfg:
        regex: (?mi)^set snmp community (public|private)\b
    then: VULN
  - when:
      cfg:
        regex: (?m)^set snmp community (?=\S{8,})(?=\S*[A-Za-z])(?=\S*\d)(?=\S*[^A-Za-z0-9\s])\S+
    then: GOOD
  - when:
      cfg:
        regex: (?m)^set snmp community
    then: VULN
  - else: GOOD
  evidence:
  - ev
remediation: 'public, private 외 복잡성 기준에 맞는 Community String을 설정※SNMP Community String 복잡성 기준 : 영어 대·소문자, 숫자, 특수문자 중 3종류 이상을 조합하여 8자리 이상으로 구성'
