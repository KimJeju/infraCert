# W-54 Dos 공격 방어 레지스트리 설정 — Windows 선언형 룰(PowerShell 조회 전용). 생성: scripts/gen_rules_windows.py
id: W-54
name: Dos 공격 방어 레지스트리 설정
severity: 중
category: 보안관리
platforms:
- windows
shell: powershell
collect:
- key: t
  cmd: $p=Get-ItemProperty -LiteralPath 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' -ErrorAction SilentlyContinue; foreach($n in @('SynAttackProtect','EnableDeadGWDetect','EnableICMPRedirect','KeepAliveTime')){
    "$n=$($p.$n)" }
  timeout: 60
extract:
- from: t
  regex: (?m)^SynAttackProtect=(?P<syn>.*)$
- from: t
  regex: (?m)^EnableDeadGWDetect=(?P<gw>.*)$
- from: t
  regex: (?m)^EnableICMPRedirect=(?P<icmp>.*)$
- from: t
  regex: (?m)^KeepAliveTime=(?P<ka>.*)$
verdict:
- when:
    syn:
      ge: 1
    gw:
      eq: '0'
    icmp:
      eq: '0'
    ka:
      le: 300000
  then: GOOD
- else: VULN
evidence:
- t
note: '기준: SynAttackProtect≥1, EnableDeadGWDetect=0, EnableICMPRedirect=0, KeepAliveTime≤300000'
remediation: 레지스트리 값을 추가 또는 수정
