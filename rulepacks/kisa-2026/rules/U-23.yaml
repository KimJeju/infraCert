# U-23 SUID, SGID, Sticky bit 설정 파일 점검 — 선언형 룰(safe_dump 생성). 명령은 상수, 판정은 화이트리스트 연산자만.
id: U-23
name: SUID, SGID, Sticky bit 설정 파일 점검
severity: 상
category: 파일및디렉터리
platforms:
- linux
- aix
- solaris
- hpux
collect:
- key: found
  cmd: find / -xdev -type f \( -perm -4000 -o -perm -2000 \) -user root 2>/dev/null | head -80
  timeout: 600
extract:
- from: found
  lines: n
verdict:
- when:
    found_ok:
      eq: 'False'
    n:
      eq: 0
  then: MANUAL
- when:
    n:
      eq: 0
  then: GOOD
- else: MANUAL
evidence:
- found
note: root 소유 SUID/SGID 파일 목록(표본 80). 불필요 여부는 운영 판단
