# W-22 FTP 디렉토리 접근권한 설정 — Windows 선언형 룰(PowerShell 조회 전용). 생성: scripts/gen_rules_windows.py
id: W-22
name: FTP 디렉토리 접근권한 설정
severity: 상
category: 서비스관리
platforms:
- windows
shell: powershell
manual: true
collect:
- key: svc
  cmd: Get-Service -Name ftpsvc,MSFTPSVC -ErrorAction SilentlyContinue | Where-Object {$_.Status -eq 'Running'} | Select-Object -ExpandProperty Name
  timeout: 60
verdict:
- when:
    svc:
      absent: true
  then: NA
- else: MANUAL
evidence:
- svc
note: FTP 미사용이면 해당없음
remediation: FTP 홈 디렉터리에서 Everyone 권한 삭제, 각 사용자에게 적절한 권한 부여
