# N-21 TFTP 서비스 차단 — Cisco IOS 선언형 룰(show 명령 전용). 생성: scripts/gen_rules_netdev.py
id: N-21
name: TFTP 서비스 차단
severity: 상
category: 기능관리
platforms:
- cisco-ios
shell: raw
collect:
- key: cfg
  cmd: show running-config
  timeout: 60
- key: ev
  cmd: show running-config | include tftp
  timeout: 60
verdict:
- when:
    cfg:
      regex: (?m)^tftp-server
  then: VULN
- else: GOOD
evidence:
- ev
remediation: 네트워크 장비의 불필요한 TFTP 서비스를 비활성화 설정
