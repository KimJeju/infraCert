# W-07 Everyone 사용 권한을 익명 사용자에 적용 — Windows 선언형 룰(PowerShell 조회 전용). 생성: scripts/gen_rules_windows.py
id: W-07
name: Everyone 사용 권한을 익명 사용자에 적용
severity: 중
category: 계정관리
platforms:
- windows
shell: powershell
collect:
- key: v
  cmd: (Get-ItemProperty -LiteralPath 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Name 'EveryoneIncludesAnonymous' -ErrorAction SilentlyContinue).'EveryoneIncludesAnonymous'
  timeout: 60
verdict:
- when:
    v:
      eq: '1'
  then: VULN
- else: GOOD
evidence:
- v
note: 값 없음 = 기본값 0(사용 안 함)
