# N-34 ICMP unreachable, redirect 차단 — Cisco IOS + Junos variant 선언형 룰(show 명령 전용). 생성: scripts/gen_rules_netdev.py
id: N-34
name: ICMP unreachable, redirect 차단
severity: 중
category: 기능관리
platforms:
- cisco-ios
shell: raw
collect:
- key: cfg
  cmd: show running-config
  timeout: 60
- key: ev
  cmd: show running-config | include unreachables|redirects|^interface
  timeout: 60
verdict:
- when:
    cfg:
      regex: (?ms)(?=.*^\s+no ip unreachables)(?=.*^\s+no ip redirects)
  then: GOOD
- else: VULN
evidence:
- ev
variants:
- platforms:
  - junos
  shell: raw
  collect:
  - key: cfg
    cmd: show configuration | display set
    timeout: 60
  - key: ev
    cmd: show configuration | display set | match "redirects|unreachable"
    timeout: 60
  verdict:
  - when:
      cfg:
        regex: (?m)^set system no-redirects
    then: GOOD
  - else: VULN
  evidence:
  - ev
remediation: 각 인터페이스에서 ICMP unreachables, ICMP redirects 비활성화
