# D-06 DB 사용자 계정을 개별적으로 부여하여 사용 — Oracle 선언형 룰(SSH→sqlplus SELECT 전용, ORACLE_HOME/ORACLE_SID 파라미터 필요). 생성: scripts/gen_rules_oracle.py
id: D-06
name: DB 사용자 계정을 개별적으로 부여하여 사용
severity: 중
category: 계정관리
platforms:
- linux
- aix
- solaris
- hpux
manual: true
collect:
- key: q
  cmd: export PATH="$ORACLE_HOME/bin:$PATH"; printf "set heading off feedback off pagesize 0 linesize 300 trimspool on\n%s\nexit\n" 'SELECT username||'"'"':'"'"'||account_status FROM dba_users WHERE username NOT IN ('"'"'SYS'"'"','"'"'SYSTEM'"'"','"'"'SYSMAN'"'"','"'"'DBSNMP'"'"','"'"'OUTLN'"'"','"'"'XDB'"'"','"'"'WMSYS'"'"','"'"'CTXSYS'"'"','"'"'MDSYS'"'"','"'"'ORDSYS'"'"','"'"'ORDDATA'"'"','"'"'OLAPSYS'"'"','"'"'EXFSYS'"'"','"'"'APEX_PUBLIC_USER'"'"','"'"'ANONYMOUS'"'"','"'"'DIP'"'"','"'"'ORACLE_OCM'"'"','"'"'APPQOSSYS'"'"','"'"'AUDSYS'"'"','"'"'GSMADMIN_INTERNAL'"'"','"'"'DBSFWUSER'"'"','"'"'GGSYS'"'"','"'"'LBACSYS'"'"','"'"'OJVMSYS'"'"','"'"'REMOTE_SCHEDULER_AGENT'"'"','"'"'SYSBACKUP'"'"','"'"'SYSDG'"'"','"'"'SYSKM'"'"','"'"'SYSRAC'"'"','"'"'SYS$UMF'"'"','"'"'DVSYS'"'"','"'"'DVF'"'"','"'"'MDDATA'"'"','"'"'ORDPLUGINS'"'"','"'"'SI_INFORMTN_SCHEMA'"'"','"'"'XS$NULL'"'"','"'"'OJVMSYS'"'"')
    ORDER BY 1;' | sqlplus -S -L / as sysdba 2>&1
  timeout: 90
extract:
- from: q
  regex: '(?P<err>ORA-\d+|SP2-\d+|TNS-\d+|sqlplus: not found|Permission denied)'
verdict:
- when:
    err:
      exists: true
  then: MANUAL
- else: MANUAL
evidence:
- q
note: 업무 계정 목록으로 1인 1계정 여부 판단
remediation: 사용자별 계정 생성 및 권한 부여
