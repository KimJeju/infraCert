# U-56 FTP 서비스 접근 제어 설정 — 선언형 룰(gen_rules_services.py 생성). 명령은 상수, 판정은 화이트리스트 연산자만.
id: U-56
name: FTP 서비스 접근 제어 설정
severity: 하
category: 서비스관리
platforms:
- linux
- aix
- solaris
- hpux
collect:
- key: ftp
  cmd: 'grep -E ''^[[:space:]]*ftp[[:space:]]'' /etc/inetd.conf 2>/dev/null | sed ''s/^/inetd: /''; [ -f /etc/xinetd.d/ftp ] && grep -iqE ''disable[[:space:]]*=[[:space:]]*no'' /etc/xinetd.d/ftp && echo ''xinetd: ftp enabled'';
    systemctl is-active ftp ftp.socket 2>/dev/null | grep -x active | sed ''s/^/systemd: ftp /''; ps -e -o comm= 2>/dev/null | grep -xE ''(vsftpd|proftpd|pure-ftpd|in.ftpd|ftpd|wu-ftpd)'' | sort -u | sed ''s/^/proc: /'''
- key: acl
  cmd: grep -hE 'ftp|vsftpd|proftpd' /etc/hosts.allow /etc/hosts.deny 2>/dev/null; grep -hiE '^[[:space:]]*(tcp_wrappers|<Limit LOGIN>|Allow from|Deny from)' /etc/vsftpd.conf /etc/vsftpd/vsftpd.conf /etc/proftpd/proftpd.conf
    2>/dev/null; ls -l /etc/ftpaccess 2>/dev/null
verdict:
- when:
    ftp:
      absent: true
  then: NA
- else: MANUAL
evidence:
- ftp
- acl
note: FTP 구동 시 접근제어(tcp_wrappers/Limit/ftpaccess) 설정 적정성 확인
remediation: ŸFTP 서비스를 사용하지 않는 경우 서비스 중지 및 비활성화 설정ŸFTP 서비스 사용 시 접근 제어 설정
