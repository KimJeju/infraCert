# D-09 일정 횟수의 로그인 실패 시 이에 대한 잠금정책 설정 — Oracle 선언형 룰(SSH→sqlplus SELECT 전용, ORACLE_HOME/ORACLE_SID 파라미터 필요). 생성: scripts/gen_rules_oracle.py
id: D-09
name: 일정 횟수의 로그인 실패 시 이에 대한 잠금정책 설정
severity: 중
category: 계정관리
platforms:
- linux
- aix
- solaris
- hpux
collect:
- key: q
  cmd: export PATH="$ORACLE_HOME/bin:$PATH"; printf "set heading off feedback off pagesize 0 linesize 300 trimspool on\n%s\nexit\n" 'SELECT limit FROM dba_profiles WHERE profile='"'"'DEFAULT'"'"' AND resource_name='"'"'FAILED_LOGIN_ATTEMPTS'"'"';' | sqlplus -S -L / as sysdba 2>&1
  timeout: 90
extract:
- from: q
  regex: '(?P<err>ORA-\d+|SP2-\d+|TNS-\d+|sqlplus: not found|Permission denied)'
verdict:
- when:
    err:
      exists: true
  then: MANUAL
- when:
    q:
      eq: UNLIMITED
  then: VULN
- when:
    q:
      le: 10
  then: GOOD
- when:
    q:
      exists: true
  then: VULN
- else: MANUAL
evidence:
- q
note: '기준: FAILED_LOGIN_ATTEMPTS 10 이하'
remediation: 로그인 시도 횟수 제한 값 설정
