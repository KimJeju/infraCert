# W-55 사용자가 프린터 드라이버를 설치할 수 없게 함 — Windows 선언형 룰(PowerShell 조회 전용). 생성: scripts/gen_rules_windows.py
id: W-55
name: 사용자가 프린터 드라이버를 설치할 수 없게 함
severity: 중
category: 보안관리
platforms:
- windows
shell: powershell
collect:
- key: v
  cmd: (Get-ItemProperty -LiteralPath 'HKLM:\SYSTEM\CurrentControlSet\Control\Print\Providers\LanMan Print Services\Servers' -Name 'AddPrinterDrivers' -ErrorAction SilentlyContinue).'AddPrinterDrivers'
  timeout: 60
verdict:
- when:
    v:
      eq: '1'
  then: GOOD
- else: VULN
evidence:
- v
remediation: “사용자가 프린터 드라이버를 설치할 수 없게 함” 정책을 “사용”으로 설정
