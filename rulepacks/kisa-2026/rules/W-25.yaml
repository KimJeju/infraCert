# W-25 DNS Zone Transfer 설정 — Windows 선언형 룰(PowerShell 조회 전용). 생성: scripts/gen_rules_windows.py
id: W-25
name: DNS Zone Transfer 설정
severity: 상
category: 서비스관리
platforms:
- windows
shell: powershell
collect:
- key: svc
  cmd: Get-Service -Name DNS -ErrorAction SilentlyContinue | Where-Object {$_.Status -eq 'Running'} | Select-Object -ExpandProperty Name
  timeout: 60
- key: zones
  cmd: Get-DnsServerZone -ErrorAction SilentlyContinue | Where-Object {-not $_.IsAutoCreated} | Select-Object ZoneName,SecureSecondaries | Format-Table -AutoSize | Out-String -Width 200
  timeout: 60
verdict:
- when:
    svc:
      absent: true
  then: GOOD
- when:
    zones:
      regex: TransferAnyServer
  then: VULN
- when:
    zones:
      regex: NoTransfer|TransferToSecureServers|TransferToZoneNameServer
  then: GOOD
- else: MANUAL
evidence:
- svc
- zones
