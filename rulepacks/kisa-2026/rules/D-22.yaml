# D-22 데이터베이스의 자원 제한 기능을 TRUE로 설정 — Oracle 선언형 룰(SSH→sqlplus SELECT 전용, ORACLE_HOME/ORACLE_SID 파라미터 필요). 생성: scripts/gen_rules_oracle.py
id: D-22
name: 데이터베이스의 자원 제한 기능을 TRUE로 설정
severity: 하
category: 옵션관리
platforms:
- linux
- aix
- solaris
- hpux
collect:
- key: q
  cmd: export PATH="$ORACLE_HOME/bin:$PATH"; printf "set heading off feedback off pagesize 0 linesize 300 trimspool on\n%s\nexit\n" 'SELECT value FROM v$parameter WHERE name='"'"'resource_limit'"'"';' | sqlplus -S -L / as sysdba 2>&1
  timeout: 90
extract:
- from: q
  regex: '(?P<err>ORA-\d+|SP2-\d+|TNS-\d+|sqlplus: not found|Permission denied)'
verdict:
- when:
    err:
      exists: true
  then: MANUAL
- when:
    q:
      regex: (?i)TRUE
  then: GOOD
- when:
    q:
      regex: (?i)FALSE
  then: VULN
- else: MANUAL
evidence:
- q
remediation: RESOURCE_LIMIT 설정을 TRUE로 설정 변경
