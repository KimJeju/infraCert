# U-62 로그인 시 경고 메시지 설정 — 선언형 룰(gen_rules_services.py 생성). 명령은 상수, 판정은 화이트리스트 연산자만.
id: U-62
name: 로그인 시 경고 메시지 설정
severity: 하
category: 서비스관리
platforms:
- linux
- aix
- solaris
- hpux
collect:
- key: banners
  cmd: 'for f in /etc/issue /etc/issue.net /etc/motd; do [ -s $f ] && grep -vE ''^[[:space:]]*$'' $f | head -3 | sed "s#^#$f: #"; done'
- key: sshb
  cmd: grep -hiE '^[[:space:]]*Banner' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf 2>/dev/null
verdict:
- when:
    banners:
      regex: '(?im)^/etc/(issue|issue\.net|motd): .*(\\n \\l|Kernel \\r on an \\m|Welcome to \S+)|^/etc/\S+: (Ubuntu|Debian|CentOS|Red Hat|Rocky|AlmaLinux|SUSE)[^\n]*$'
    sshb:
      absent: true
  then: VULN
- when:
    banners:
      exists: true
  then: GOOD
- when:
    sshb:
      regex: (?i)Banner\s+/
  then: GOOD
- else: VULN
evidence:
- banners
- sshb
note: /etc/issue(.net)·/etc/motd 또는 sshd Banner 에 경고문이 있어야 양호
