# D-21 인가되지 않은 GRANT OPTION 사용 제한 — Oracle 선언형 룰(SSH→sqlplus SELECT 전용, ORACLE_HOME/ORACLE_SID 파라미터 필요). 생성: scripts/gen_rules_oracle.py
id: D-21
name: 인가되지 않은 GRANT OPTION 사용 제한
severity: 중
category: 접근관리
platforms:
- linux
- aix
- solaris
- hpux
collect:
- key: q
  cmd: export PATH="$ORACLE_HOME/bin:$PATH"; printf "set heading off feedback off pagesize 0 linesize 300 trimspool on\n%s\nexit\n" 'SELECT grantee||'"'"':'"'"'||owner||'"'"'.'"'"'||table_name FROM dba_tab_privs WHERE grantable='"'"'YES'"'"' AND grantee NOT IN ('"'"'SYS'"'"','"'"'SYSTEM'"'"') AND grantee
    NOT IN (SELECT role FROM dba_roles) AND owner NOT IN (SELECT username FROM dba_users WHERE oracle_maintained='"'"'Y'"'"') AND grantee NOT IN (SELECT username FROM dba_users WHERE oracle_maintained='"'"'Y'"'"');' | sqlplus -S -L / as sysdba 2>&1
  timeout: 90
extract:
- from: q
  regex: '(?P<err>ORA-\d+|SP2-\d+|TNS-\d+|sqlplus: not found|Permission denied)'
verdict:
- when:
    err:
      exists: true
  then: MANUAL
- when:
    q:
      absent: true
  then: GOOD
- else: VULN
evidence:
- q
note: Oracle 관리 계정·객체 제외. 롤이 아닌 일반 계정에 WITH GRANT OPTION 이 있으면 취약(11g 는 oracle_maintained 없어 MANUAL)
remediation: WITH_GRANT_OPTION이 ROLE에 의하여 설정되도록 변경
