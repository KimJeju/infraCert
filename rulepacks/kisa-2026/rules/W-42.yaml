# W-42 이벤트 로그 관리 설정 — Windows 선언형 룰(PowerShell 조회 전용). 생성: scripts/gen_rules_windows.py
id: W-42
name: 이벤트 로그 관리 설정
severity: 하
category: 로그관리
platforms:
- windows
shell: powershell
collect:
- key: small
  cmd: (Get-WinEvent -ListLog Application,Security,System -ErrorAction SilentlyContinue | Where-Object {$_.MaximumSizeInBytes -lt 10485760}).Count
  timeout: 60
- key: logs
  cmd: Get-WinEvent -ListLog Application,Security,System -ErrorAction SilentlyContinue | Select-Object LogName,MaximumSizeInBytes,LogMode | Format-Table -AutoSize | Out-String
  timeout: 60
verdict:
- when:
    small:
      eq: '0'
  then: GOOD
- when:
    small:
      ge: 1
  then: VULN
- else: MANUAL
evidence:
- logs
note: '기준: 최대 로그 크기 10,240KB 이상. 덮어쓰기 90일 정책은 별도 확인'
remediation: 최대 로그 크기 “10,204KB”, “90일 이후 이벤트 덮어씀” 설정
