# U-41 불필요한 automountd 제거 — 선언형 룰(gen_rules_services.py 생성). 명령은 상수, 판정은 화이트리스트 연산자만.
id: U-41
name: 불필요한 automountd 제거
severity: 상
category: 서비스관리
platforms:
- linux
- aix
- solaris
- hpux
collect:
- key: found
  cmd: 'grep -E ''^[[:space:]]*autofs[[:space:]]'' /etc/inetd.conf 2>/dev/null | sed ''s/^/inetd: /''; [ -f /etc/xinetd.d/autofs ] && grep -iqE ''disable[[:space:]]*=[[:space:]]*no'' /etc/xinetd.d/autofs && echo ''xinetd:
    autofs enabled''; systemctl is-active autofs autofs.socket 2>/dev/null | grep -x active | sed ''s/^/systemd: autofs /''; ps -e -o comm= 2>/dev/null | grep -xE ''(automount|automountd|autofs)'' | sort -u | sed ''s/^/proc:
    /'''
  timeout: 60
extract:
- from: found
  lines: n
verdict:
- when:
    found_ok:
      eq: 'False'
    n:
      eq: 0
  then: MANUAL
- when:
    n:
      eq: 0
  then: GOOD
- else: VULN
evidence:
- found
note: automount 활성이면 취약
remediation: automountd 서비스 비활성화 설정
