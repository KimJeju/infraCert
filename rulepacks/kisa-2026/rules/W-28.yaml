# W-28 터미널 서비스 암호화 수준 설정 — Windows 선언형 룰(PowerShell 조회 전용). 생성: scripts/gen_rules_windows.py
id: W-28
name: 터미널 서비스 암호화 수준 설정
severity: 중
category: 서비스관리
platforms:
- windows
shell: powershell
collect:
- key: deny
  cmd: (Get-ItemProperty -LiteralPath 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -ErrorAction SilentlyContinue).'fDenyTSConnections'
  timeout: 60
- key: lvl
  cmd: (Get-ItemProperty -LiteralPath 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'MinEncryptionLevel' -ErrorAction SilentlyContinue).'MinEncryptionLevel'
  timeout: 60
verdict:
- when:
    deny:
      eq: '1'
  then: GOOD
- when:
    lvl:
      ge: 2
  then: GOOD
- when:
    lvl:
      exists: true
  then: VULN
- else: MANUAL
evidence:
- deny
- lvl
note: 원격 데스크톱 미사용 또는 MinEncryptionLevel 2(클라이언트 호환) 이상
remediation: 원격 데스크톱 서비스의 가동을 ‘중지’ 및 ‘사용 안 함’ 설정을 하거나, 부득이하게 사용할 경우 암호화 수준 설정 적용
