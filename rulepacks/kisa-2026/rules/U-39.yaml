# U-39 불필요한 NFS 서비스 비활성화 — 선언형 룰(gen_rules_services.py 생성). 명령은 상수, 판정은 화이트리스트 연산자만.
id: U-39
name: 불필요한 NFS 서비스 비활성화
severity: 상
category: 서비스관리
platforms:
- linux
- aix
- solaris
- hpux
collect:
- key: found
  cmd: 'grep -E ''^[[:space:]]*nfs-server[[:space:]]'' /etc/inetd.conf 2>/dev/null | sed ''s/^/inetd: /''; [ -f /etc/xinetd.d/nfs-server ] && grep -iqE ''disable[[:space:]]*=[[:space:]]*no'' /etc/xinetd.d/nfs-server && echo
    ''xinetd: nfs-server enabled''; systemctl is-active nfs-server nfs-server.socket 2>/dev/null | grep -x active | sed ''s/^/systemd: nfs-server /''; grep -E ''^[[:space:]]*nfs[[:space:]]'' /etc/inetd.conf 2>/dev/null | sed
    ''s/^/inetd: /''; [ -f /etc/xinetd.d/nfs ] && grep -iqE ''disable[[:space:]]*=[[:space:]]*no'' /etc/xinetd.d/nfs && echo ''xinetd: nfs enabled''; systemctl is-active nfs nfs.socket 2>/dev/null | grep -x active | sed ''s/^/systemd:
    nfs /''; ps -e -o comm= 2>/dev/null | grep -xE ''(nfsd|rpc.mountd|mountd|biod|rpc.nfsd)'' | sort -u | sed ''s/^/proc: /'''
  timeout: 60
extract:
- from: found
  lines: n
verdict:
- when:
    found_ok:
      eq: 'False'
    n:
      eq: 0
  then: MANUAL
- when:
    n:
      eq: 0
  then: GOOD
- else: VULN
evidence:
- found
note: NFS 데몬 활성이면 취약(운영상 필요 시 예외 사유 기록)
remediation: NFS 서비스를 사용하지 않는 경우 서비스 중지 및 비활성화 설정※로컬 서버에 마운트 되어 있는 디렉터리 제거 및 공유 디렉터리 제거 후 서비스 중지 가능
