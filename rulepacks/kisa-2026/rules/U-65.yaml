# U-65 NTP 및 시각 동기화 설정 — 선언형 룰(gen_rules_services.py 생성). 명령은 상수, 판정은 화이트리스트 연산자만.
id: U-65
name: NTP 및 시각 동기화 설정
severity: 중
category: 로그관리
platforms:
- linux
- aix
- solaris
- hpux
collect:
- key: ntp
  cmd: 'ps -e -o comm= 2>/dev/null | grep -xE ''(chronyd|ntpd|xntpd|systemd-timesyn|systemd-timesyncd|openntpd)'' | sort -u; systemctl is-active chronyd ntpd systemd-timesyncd 2>/dev/null | grep -x active | sed ''s/^/systemd:
    /''; timedatectl 2>/dev/null | grep -iE ''NTP (service|synchronized)|synchronized'''
- key: src
  cmd: grep -hE '^[[:space:]]*(server|pool|peer)[[:space:]]' /etc/chrony.conf /etc/chrony/chrony.conf /etc/ntp.conf 2>/dev/null | head -5; grep -hE '^[[:space:]]*NTP=' /etc/systemd/timesyncd.conf 2>/dev/null
verdict:
- when:
    ntp:
      regex: (?i)chronyd|ntpd|timesync|active|yes
  then: GOOD
- else: VULN
evidence:
- ntp
- src
note: chronyd/ntpd/systemd-timesyncd 가 동작하고 동기화 서버가 있어야 양호
remediation: NTP 설정 및 동기화 주기 설정
