# N-10 로그인 시 경고 메시지 설정 — Cisco IOS 선언형 룰(show 명령 전용). 생성: scripts/gen_rules_netdev.py
id: N-10
name: 로그인 시 경고 메시지 설정
severity: 중
category: 접근관리
platforms:
- cisco-ios
shell: raw
collect:
- key: cfg
  cmd: show running-config
  timeout: 60
- key: ev
  cmd: show running-config | include ^banner
  timeout: 60
verdict:
- when:
    cfg:
      regex: (?m)^banner (login|motd)
  then: GOOD
- else: VULN
evidence:
- ev
remediation: 네트워크 장비 접속 시 경고 메시지 설정
