# W-35 불필요한 ODBC/OLE-DB 데이터 소스와 드라이브 제거 — Windows 선언형 룰(PowerShell 조회 전용). 생성: scripts/gen_rules_windows.py
id: W-35
name: 불필요한 ODBC/OLE-DB 데이터 소스와 드라이브 제거
severity: 중
category: 서비스관리
platforms:
- windows
shell: powershell
collect:
- key: dsn
  cmd: Get-OdbcDsn -DsnType System -ErrorAction SilentlyContinue | Select-Object Name,DriverName | Format-Table -AutoSize | Out-String
  timeout: 60
verdict:
- when:
    dsn:
      absent: true
  then: GOOD
- else: MANUAL
evidence:
- dsn
note: 시스템 DSN 이 없으면 양호
remediation: 사용하지 않는 불필요한 ODBC 데이터 소스 제거
