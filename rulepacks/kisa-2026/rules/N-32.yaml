# N-32 Source Routing 차단 — Cisco IOS 선언형 룰(show 명령 전용). 생성: scripts/gen_rules_netdev.py
id: N-32
name: Source Routing 차단
severity: 중
category: 기능관리
platforms:
- cisco-ios
shell: raw
collect:
- key: cfg
  cmd: show running-config
  timeout: 60
- key: ev
  cmd: show running-config | include source-route
  timeout: 60
verdict:
- when:
    cfg:
      regex: (?m)^no ip source-route
  then: GOOD
- else: VULN
evidence:
- ev
note: 기본 활성 → no ip source-route 필요
remediation: 각 인터페이스에서 ip-source-route 차단 설정
