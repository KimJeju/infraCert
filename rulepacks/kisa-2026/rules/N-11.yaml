# N-11 원격로그 서버 사용 — Cisco IOS 선언형 룰(show 명령 전용). 생성: scripts/gen_rules_netdev.py
id: N-11
name: 원격로그 서버 사용
severity: 중
category: 패치관리
platforms:
- cisco-ios
shell: raw
collect:
- key: cfg
  cmd: show running-config
  timeout: 60
- key: ev
  cmd: show running-config | include ^logging
  timeout: 60
verdict:
- when:
    cfg:
      regex: (?m)^logging (host )?\d+\.\d+\.\d+\.\d+
  then: GOOD
- else: VULN
evidence:
- ev
remediation: Syslog 등을 이용하여 로그 저장 설정
