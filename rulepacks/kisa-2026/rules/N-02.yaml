# N-02 비밀번호 복잡성 설정 — Cisco IOS 선언형 룰(show 명령 전용). 생성: scripts/gen_rules_netdev.py
id: N-02
name: 비밀번호 복잡성 설정
severity: 상
category: 계정관리
platforms:
- cisco-ios
shell: raw
collect:
- key: cfg
  cmd: show running-config
  timeout: 60
- key: ev
  cmd: show running-config | include passwords min-length|aaa
  timeout: 60
extract:
- from: cfg
  regex: (?m)^security passwords min-length (?P<n>\d+)
verdict:
- when:
    n:
      ge: 8
  then: GOOD
- else: MANUAL
evidence:
- ev
note: security passwords min-length 8 이상이면 양호, 없으면 기관 정책으로 판단
remediation: 관리기관의 비밀번호 작성규칙에 맞게 비밀번호 복잡성 정책 및 비밀번호 설정
