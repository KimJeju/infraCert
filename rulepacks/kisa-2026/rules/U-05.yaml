# U-05 root 이외의 UID 0 금지
id: U-05
name: root 이외의 UID 0 금지
severity: 상
category: 계정관리
platforms: [linux, aix, solaris, hpux]
collect:
  - key: uid0
    cmd: "awk -F: '$3 == 0 {print $1}' /etc/passwd 2>/dev/null"
  - key: extra
    cmd: "awk -F: '$3 == 0 && $1 != \"root\" {print $1}' /etc/passwd 2>/dev/null"
extract:
  - from: extra
    lines: n_extra
verdict:
  - when: {uid0_ok: {eq: "False"}}
    then: MANUAL                      # /etc/passwd 읽기 실패
  - when: {n_extra: {eq: 0}}
    then: GOOD
  - else: VULN
evidence: [uid0]
note: "UID 0 계정 목록. root 외 존재 시 취약"
remediation: ŸUID가 0으로 설정된 계정을 0 이외의 중복되지 않은 UID로 변경 또는 불필요한 계정인 경우 제거하도록 설정Ÿ(사용 중인 계정인 경우 명령어를 통한 조치가 적용되지 않을 수 있으므로 /etc/passwd 파일을 통해 변경)
