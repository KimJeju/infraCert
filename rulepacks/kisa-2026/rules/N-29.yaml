# N-29 Bootp 서비스 차단 — Cisco IOS 선언형 룰(show 명령 전용). 생성: scripts/gen_rules_netdev.py
id: N-29
name: Bootp 서비스 차단
severity: 중
category: 기능관리
platforms:
- cisco-ios
shell: raw
collect:
- key: cfg
  cmd: show running-config
  timeout: 60
- key: ev
  cmd: show running-config | include bootp
  timeout: 60
verdict:
- when:
    cfg:
      regex: (?m)^no ip bootp server
  then: GOOD
- else: VULN
evidence:
- ev
note: 기본 활성 → no ip bootp server 필요
remediation: 장비별 BOOTP 서비스 제한 설정
