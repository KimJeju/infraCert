# U-24 사용자, 시스템 환경변수 파일 소유자 및 권한 설정 — 선언형 룰(safe_dump 생성). 명령은 상수, 판정은 화이트리스트 연산자만.
id: U-24
name: 사용자, 시스템 환경변수 파일 소유자 및 권한 설정
severity: 상
category: 파일및디렉터리
platforms:
- linux
- aix
- solaris
- hpux
collect:
- key: found
  cmd: find /root /home -maxdepth 2 \( -name .profile -o -name .bashrc -o -name .bash_profile -o -name .cshrc -o -name .login -o -name .kshrc -o -name .exrc -o -name .netrc \) -perm -0002 2>/dev/null |
    head -50
  timeout: 120
extract:
- from: found
  lines: n
verdict:
- when:
    found_ok:
      eq: 'False'
    n:
      eq: 0
  then: MANUAL
- when:
    n:
      eq: 0
  then: GOOD
- else: VULN
evidence:
- found
note: 환경변수 파일 중 world-writable
