# U-22 /etc/services 파일 소유자 및 권한
id: U-22
name: /etc/services 파일 소유자 및 권한
severity: 상
category: 파일및디렉터리
platforms: [linux, aix, solaris, hpux]
collect:
  - key: ls
    cmd: "ls -ld /etc/services 2>/dev/null | head -1"
extract:
  - from: ls
    regex: '^(?P<perm>\S{10})\s+\S+\s+(?P<owner>\S+)\s+(?P<group>\S+)'
    missing: NA
verdict:
  - when: {owner: {ne: root}}
    then: VULN
  - when: {perm: {mode_le: "644"}}
    then: GOOD
  - else: VULN
evidence: [ls]
note: "기준: 소유자 root, 권한 644 이하"
