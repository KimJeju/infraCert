# N-25 TCP Keepalive 서비스 설정 — Cisco IOS 선언형 룰(show 명령 전용). 생성: scripts/gen_rules_netdev.py
id: N-25
name: TCP Keepalive 서비스 설정
severity: 중
category: 기능관리
platforms:
- cisco-ios
shell: raw
collect:
- key: cfg
  cmd: show running-config
  timeout: 60
- key: ev
  cmd: show running-config | include keepalives
  timeout: 60
verdict:
- when:
    cfg:
      regex: (?m)^service tcp-keepalives-in
  then: GOOD
- else: VULN
evidence:
- ev
remediation: 네트워크 장비에서 TCP Keepalive 서비스를 사용하도록 설정
