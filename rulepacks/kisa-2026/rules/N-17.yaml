# N-17 SNMP 서비스 확인 — Cisco IOS 선언형 룰(show 명령 전용). 생성: scripts/gen_rules_netdev.py
id: N-17
name: SNMP 서비스 확인
severity: 상
category: 기능관리
platforms:
- cisco-ios
shell: raw
collect:
- key: cfg
  cmd: show running-config
  timeout: 60
- key: ev
  cmd: show running-config | include ^snmp-server
  timeout: 60
verdict:
- when:
    cfg:
      regex: (?m)^snmp-server community
  then: MANUAL
- else: GOOD
evidence:
- ev
note: SNMP 설정이 없으면 양호, 있으면 사용 필요성 판단
remediation: 장비별 제공하는 최신 취약점 정보를 파악 후 최신 패치 및 업그레이드를 수행
