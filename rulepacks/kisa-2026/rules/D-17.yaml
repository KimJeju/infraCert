# D-17 Audit Table은 데이터베이스 관리자 계정으로 접근하도록 제한 — Oracle 선언형 룰(SSH→sqlplus SELECT 전용, ORACLE_HOME/ORACLE_SID 파라미터 필요). 생성: scripts/gen_rules_oracle.py
id: D-17
name: Audit Table은 데이터베이스 관리자 계정으로 접근하도록 제한
severity: 하
category: 접근관리
platforms:
- linux
- aix
- solaris
- hpux
collect:
- key: q
  cmd: export PATH="$ORACLE_HOME/bin:$PATH"; printf "set heading off feedback off pagesize 0 linesize 300 trimspool on\n%s\nexit\n" 'SELECT grantee||'"'"':'"'"'||privilege FROM dba_tab_privs WHERE table_name='"'"'AUD$'"'"' AND grantee NOT IN ('"'"'SYS'"'"','"'"'SYSTEM'"'"','"'"'DBA'"'"','"'"'AUDIT_ADMIN'"'"','"'"'AUDIT_VIEWER'"'"','"'"'SELECT_CATALOG_ROLE'"'"','"'"'DELETE_CATALOG_ROLE'"'"');'
    | sqlplus -S -L / as sysdba 2>&1
  timeout: 90
extract:
- from: q
  regex: '(?P<err>ORA-\d+|SP2-\d+|TNS-\d+|sqlplus: not found|Permission denied)'
verdict:
- when:
    err:
      exists: true
  then: MANUAL
- when:
    q:
      absent: true
  then: GOOD
- else: VULN
evidence:
- q
remediation: Audit Table 접근 권한을 관리자 계정으로 제한
