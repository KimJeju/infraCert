# D-05 비밀번호 재사용에 대한 제약 설정 — Oracle 선언형 룰(SSH→sqlplus SELECT 전용, ORACLE_HOME/ORACLE_SID 파라미터 필요). 생성: scripts/gen_rules_oracle.py
id: D-05
name: 비밀번호 재사용에 대한 제약 설정
severity: 중
category: 계정관리
platforms:
- linux
- aix
- solaris
- hpux
collect:
- key: q
  cmd: export PATH="$ORACLE_HOME/bin:$PATH"; printf "set heading off feedback off pagesize 0 linesize 300 trimspool on\n%s\nexit\n" 'SELECT resource_name||'"'"'='"'"'||limit FROM dba_profiles WHERE profile='"'"'DEFAULT'"'"' AND resource_name IN ('"'"'PASSWORD_REUSE_MAX'"'"','"'"'PASSWORD_REUSE_TIME'"'"');'
    | sqlplus -S -L / as sysdba 2>&1
  timeout: 90
extract:
- from: q
  regex: '(?P<err>ORA-\d+|SP2-\d+|TNS-\d+|sqlplus: not found|Permission denied)'
verdict:
- when:
    err:
      exists: true
  then: MANUAL
- when:
    q:
      regex: (?s)(?=.*PASSWORD_REUSE_MAX=UNLIMITED)(?=.*PASSWORD_REUSE_TIME=UNLIMITED)
  then: VULN
- when:
    q:
      regex: =\d+
  then: GOOD
- else: MANUAL
evidence:
- q
remediation: PASSWORD_REUSE_TIME, PASSWORD_REUSE_MAX 파라미터 설정
