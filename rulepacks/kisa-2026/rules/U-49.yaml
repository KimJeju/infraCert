# U-49 DNS 보안 버전 패치 — 선언형 룰(gen_rules_services.py 생성). 명령은 상수, 판정은 화이트리스트 연산자만.
id: U-49
name: DNS 보안 버전 패치
severity: 상
category: 서비스관리
platforms:
- linux
- aix
- solaris
- hpux
collect:
- key: named
  cmd: ps -e -o comm= 2>/dev/null | grep -xE '(named|named-pkcs11|bind9)' | sort -u
- key: ver
  cmd: named -v 2>/dev/null | head -1
verdict:
- when:
    named:
      absent: true
  then: NA
- else: MANUAL
evidence:
- named
- ver
note: BIND 미구동 N/A. 구동 시 버전을 ISC 공지와 대조(수동)
remediation: ŸDNS 서비스를 사용하지 않는 경우 서비스 중지 및 비활성화 설정ŸDNS 서비스 사용 시 패치 관리 정책 수립 및 주기적으로 패치 적용 설정※DNS 서비스의 경우 대부분의 버전에서 취약점이 보고되고 있으므로 OS 관리자, 서비스 개발자가 패치 적용에 따른 서비스 영향 정도를 정확히 파악하여 주기적인 패치 적용 정책 수리 후 적용
