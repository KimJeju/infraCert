# D-25 주기적 보안 패치 및 벤더 권고 사항 적용 — Oracle 선언형 룰(SSH→sqlplus SELECT 전용, ORACLE_HOME/ORACLE_SID 파라미터 필요). 생성: scripts/gen_rules_oracle.py
id: D-25
name: 주기적 보안 패치 및 벤더 권고 사항 적용
severity: 상
category: 패치관리
platforms:
- linux
- aix
- solaris
- hpux
manual: true
collect:
- key: q
  cmd: export PATH="$ORACLE_HOME/bin:$PATH"; printf "set heading off feedback off pagesize 0 linesize 300 trimspool on\n%s\nexit\n" 'SELECT banner_full FROM v$version WHERE rownum=1;' | sqlplus -S -L / as sysdba 2>&1
  timeout: 90
- key: patch
  cmd: export PATH="$ORACLE_HOME/bin:$PATH"; "$ORACLE_HOME/OPatch/opatch" lspatches 2>&1 | head -20
  timeout: 90
extract:
- from: q
  regex: '(?P<err>ORA-\d+|SP2-\d+|TNS-\d+|sqlplus: not found|Permission denied)'
verdict:
- when:
    err:
      exists: true
  then: MANUAL
- else: MANUAL
evidence:
- q
- patch
note: 버전·패치 목록을 Oracle Critical Patch Update 와 대조
remediation: 보안 패치가 적용된 버전으로 업데이트
