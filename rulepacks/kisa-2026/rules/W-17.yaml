# W-17 하드디스크 기본 공유 제거 — Windows 선언형 룰(PowerShell 조회 전용). 생성: scripts/gen_rules_windows.py
id: W-17
name: 하드디스크 기본 공유 제거
severity: 상
category: 서비스관리
platforms:
- windows
shell: powershell
collect:
- key: reg
  cmd: $p=Get-ItemProperty -LiteralPath 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters' -ErrorAction SilentlyContinue; foreach($n in @('AutoShareServer','AutoShareWks')){ "$n=$($p.$n)"
    }
  timeout: 60
- key: sh
  cmd: Get-SmbShare -ErrorAction SilentlyContinue | Where-Object {$_.Name -match '^[A-Z]\$$|^ADMIN\$$'} | Select-Object -ExpandProperty Name
  timeout: 60
verdict:
- when:
    sh_ok:
      eq: 'False'
  then: MANUAL
- when:
    sh:
      absent: true
    reg:
      regex: AutoShare(Server|Wks)=0
  then: GOOD
- else: VULN
evidence:
- reg
- sh
note: '기준: AutoShareServer(Wks)=0 이고 C$/ADMIN$ 등 기본 공유 없음'
