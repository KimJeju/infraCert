# W-60 보안 채널 데이터 디지털 암호화 또는 서명 — Windows 선언형 룰(PowerShell 조회 전용). 생성: scripts/gen_rules_windows.py
id: W-60
name: 보안 채널 데이터 디지털 암호화 또는 서명
severity: 중
category: 보안관리
platforms:
- windows
shell: powershell
collect:
- key: t
  cmd: $p=Get-ItemProperty -LiteralPath 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters' -ErrorAction SilentlyContinue; foreach($n in @('RequireSignOrSeal','SealSecureChannel','SignSecureChannel')){
    "$n=$($p.$n)" }
  timeout: 60
extract:
- from: t
  regex: (?m)^RequireSignOrSeal=(?P<a>.*)$
- from: t
  regex: (?m)^SealSecureChannel=(?P<b>.*)$
- from: t
  regex: (?m)^SignSecureChannel=(?P<c>.*)$
verdict:
- when:
    a:
      eq: '1'
    b:
      eq: '1'
    c:
      eq: '1'
  then: GOOD
- else: VULN
evidence:
- t
remediation: 보안 채널 데이터를 디지털 암호화·서명 관련 3개 정책 → 사용
