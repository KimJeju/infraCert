# D-08 안전한 암호화 알고리즘 사용 — Oracle 선언형 룰(SSH→sqlplus SELECT 전용, ORACLE_HOME/ORACLE_SID 파라미터 필요). 생성: scripts/gen_rules_oracle.py
id: D-08
name: 안전한 암호화 알고리즘 사용
severity: 상
category: 계정관리
platforms:
- linux
- aix
- solaris
- hpux
collect:
- key: q
  cmd: export PATH="$ORACLE_HOME/bin:$PATH"; printf "set heading off feedback off pagesize 0 linesize 300 trimspool on\n%s\nexit\n" 'SELECT DISTINCT password_versions FROM dba_users WHERE account_status LIKE '"'"'OPEN%'"'"' AND password_versions IS NOT NULL;' | sqlplus -S -L / as sysdba 2>&1
  timeout: 90
extract:
- from: q
  regex: '(?P<err>ORA-\d+|SP2-\d+|TNS-\d+|sqlplus: not found|Permission denied)'
verdict:
- when:
    err:
      exists: true
  then: MANUAL
- when:
    q:
      regex: 11G|12C
  then: GOOD
- when:
    q:
      regex: 10G
  then: VULN
- else: MANUAL
evidence:
- q
note: password_versions 에 11G(SHA-1)/12C(SHA-512) 가 있으면 양호, 10G(DES)만이면 취약
remediation: SHA-256 이상의 암호화 알고리즘 적용
