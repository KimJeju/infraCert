# U-14 root 홈, 패스 디렉터리 권한 및 PATH 설정 — 선언형 룰(safe_dump 생성). 명령은 상수, 판정은 화이트리스트 연산자만.
id: U-14
name: root 홈, 패스 디렉터리 권한 및 PATH 설정
severity: 상
category: 파일및디렉터리
platforms:
- linux
- aix
- solaris
- hpux
collect:
- key: path
  cmd: grep -hE '^\s*(export\s+)?PATH\s*=' /etc/profile /etc/environment /root/.profile /root/.bash_profile /root/.bashrc /root/.cshrc /root/.login 2>/dev/null
- key: home
  cmd: ls -ld /root / 2>/dev/null
verdict:
- when:
    path:
      absent: true
  then: MANUAL
- when:
    path:
      regex: (=|:)\.(:|$)|::|(=|:)\.\s*$
  then: VULN
- else: GOOD
evidence:
- path
- home
note: PATH 항목에 '.'(현재 디렉터리) 또는 빈 항목('::')이 있으면 취약. /root 읽기 불가 시 수동
remediation: root 계정의 환경설정 파일(/.profile, /.bashrc 등)과 시스템 환경설정 파일(/etc/profile 등)에 설정된 PATH 환경변수에서 현재 디렉터리를 나타내는 “.”을 PATH 환경변수의 마지막으로 이동하도록 설정※/etc/profile 파일, root 계정, 일반 사용자 계정의 환경설정 파일을 순차적으로 검색하여 확인
