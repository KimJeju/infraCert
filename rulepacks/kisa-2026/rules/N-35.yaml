# N-35 identd 서비스 차단 — Cisco IOS 선언형 룰(show 명령 전용). 생성: scripts/gen_rules_netdev.py
id: N-35
name: identd 서비스 차단
severity: 중
category: 기능관리
platforms:
- cisco-ios
shell: raw
collect:
- key: cfg
  cmd: show running-config
  timeout: 60
- key: ev
  cmd: show running-config | include identd
  timeout: 60
verdict:
- when:
    cfg:
      regex: (?m)^ip identd
  then: VULN
- else: GOOD
evidence:
- ev
remediation: idnetd 서비스 비활성화
