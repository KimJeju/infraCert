# U-60 SNMP Community String 복잡성 설정 — 선언형 룰(gen_rules_services.py 생성). 명령은 상수, 판정은 화이트리스트 연산자만.
id: U-60
name: SNMP Community String 복잡성 설정
severity: 중
category: 서비스관리
platforms:
- linux
- aix
- solaris
- hpux
collect:
- key: snmp
  cmd: 'grep -E ''^[[:space:]]*snmpd[[:space:]]'' /etc/inetd.conf 2>/dev/null | sed ''s/^/inetd: /''; [ -f /etc/xinetd.d/snmpd ] && grep -iqE ''disable[[:space:]]*=[[:space:]]*no'' /etc/xinetd.d/snmpd && echo ''xinetd: snmpd
    enabled''; systemctl is-active snmpd snmpd.socket 2>/dev/null | grep -x active | sed ''s/^/systemd: snmpd /''; ps -e -o comm= 2>/dev/null | grep -xE ''(snmpd|snmpdv3ne|snmpdv1)'' | sort -u | sed ''s/^/proc: /'''
- key: com
  cmd: grep -vE '^[[:space:]]*#|^[[:space:]]*$' /etc/snmp/snmpd.conf /etc/snmpd.conf /etc/snmpdv3.conf 2>/dev/null | grep -iE '^[[:space:]]*(r[ow]community6?|com2sec|community)[[:space:]]'
verdict:
- when:
    snmp:
      absent: true
  then: NA
- when:
    com:
      absent: true
  then: NA
- when:
    com:
      regex: (?i)\s(public|private)(\s|$)
  then: VULN
- else: MANUAL
evidence:
- com
note: 커뮤니티 문자열이 public/private 이면 취약. 그 외는 복잡성(길이·문자조합) 수동확인
remediation: ŸSNMP 서비스를 사용하지 않는 경우 서비스 중지 및 비활성화 설정ŸSNMP 서비스 사용 시 SNMP Community String 기본값인 “public”, “private”이 아닌 영문자, 숫자 포함 10자리 이상 또는 영문자, 숫자, 특수문자 포함 8자리 이상으로 설정
