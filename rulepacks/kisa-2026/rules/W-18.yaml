# W-18 불필요한 서비스 제거 — Windows 선언형 룰(PowerShell 조회 전용). 생성: scripts/gen_rules_windows.py
id: W-18
name: 불필요한 서비스 제거
severity: 상
category: 서비스관리
platforms:
- windows
shell: powershell
collect:
- key: svc
  cmd: Get-Service -Name Alerter,ClipSrv,Messenger,simptcp,Browser,CiSvc,TrkWks,TrkSvr,Fax,Spooler,WerSvc,RemoteAccess,TapiSrv,TlntSvr,WinHttpAutoProxySvc -ErrorAction SilentlyContinue | Where-Object {$_.Status
    -eq 'Running'} | Select-Object -ExpandProperty Name
  timeout: 60
verdict:
- when:
    svc:
      absent: true
  then: GOOD
- else: MANUAL
evidence:
- svc
note: 가이드 목록의 불필요 서비스가 하나도 실행 중이 아니면 양호. 실행 중이면 업무 필요성 판단(Spooler 등)
remediation: 서비스 중지 후 “사용 안 함” 설정
