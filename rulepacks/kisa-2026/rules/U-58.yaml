# U-58 불필요한 SNMP 서비스 구동 점검 — 선언형 룰(gen_rules_services.py 생성). 명령은 상수, 판정은 화이트리스트 연산자만.
id: U-58
name: 불필요한 SNMP 서비스 구동 점검
severity: 중
category: 서비스관리
platforms:
- linux
- aix
- solaris
- hpux
collect:
- key: found
  cmd: 'grep -E ''^[[:space:]]*snmpd[[:space:]]'' /etc/inetd.conf 2>/dev/null | sed ''s/^/inetd: /''; [ -f /etc/xinetd.d/snmpd ] && grep -iqE ''disable[[:space:]]*=[[:space:]]*no'' /etc/xinetd.d/snmpd && echo ''xinetd: snmpd
    enabled''; systemctl is-active snmpd snmpd.socket 2>/dev/null | grep -x active | sed ''s/^/systemd: snmpd /''; ps -e -o comm= 2>/dev/null | grep -xE ''(snmpd|snmpdv3ne|snmpdv1)'' | sort -u | sed ''s/^/proc: /'''
  timeout: 60
extract:
- from: found
  lines: n
verdict:
- when:
    found_ok:
      eq: 'False'
    n:
      eq: 0
  then: MANUAL
- when:
    n:
      eq: 0
  then: GOOD
- else: VULN
evidence:
- found
note: snmpd 구동이면 취약(운영상 필요 시 예외 사유 기록)
