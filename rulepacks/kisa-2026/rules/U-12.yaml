# U-12 /etc/(x)inetd.conf 소유자 및 권한 — 선언형 룰. 명령은 상수, 판정은 화이트리스트 연산자만.
id: U-12
name: /etc/(x)inetd.conf 소유자 및 권한
severity: 상
category: 파일및디렉터리
platforms: [linux, aix, solaris, hpux]
collect:
  - key: ls
    cmd: "ls -ld /etc/inetd.conf /etc/xinetd.conf 2>/dev/null | head -1"
extract:
  - from: ls
    regex: '^(?P<perm>\S{10})\s+\S+\s+(?P<owner>\S+)\s+(?P<group>\S+)'
    missing: NA                       # 파일 없음/읽기 불가 → 해당없음 (추측 안 함)
verdict:
  - when: {owner: {ne: root}}
    then: VULN
  - when: {perm: {mode_le: "600"}}
    then: GOOD
  - else: VULN
evidence: [ls]
note: "기준: 소유자 root, 권한 600 이하"
