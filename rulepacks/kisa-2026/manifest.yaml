rules:
- id: D-01
  name: 기본 계정의 비밀번호/정책 변경
  severity: 상
  category: DBMS
  remediation: 기본(관리자) 계정의 초기 비밀번호 및 권한 정책 변경
  manual: false
- id: D-02
  name: 불필요(데모/샘플) 계정 제거
  severity: 상
  category: DBMS
  remediation: 계정별 용도를 파악한 후 불필요한 계정 삭제
  manual: false
- id: D-03
  name: 비밀번호 사용기간/복잡도 (DEFAULT 프로파일 기준)
  severity: 상
  category: DBMS
  remediation: 기관 정책에 맞게 비밀번호 사용 기간 및 복잡도 정책 설정
  manual: false
- id: D-04
  name: DBA(관리자) 권한 최소화
  severity: 상
  category: DBMS
  remediation: 관리자 권한이 필요한 계정 및 그룹에만 관리자 권한 부여
  manual: false
- id: D-05
  name: 비밀번호 재사용 제약 (DEFAULT 프로파일)
  severity: 중
  category: DBMS
  remediation: PASSWORD_REUSE_TIME, PASSWORD_REUSE_MAX 파라미터 설정
  manual: false
- id: D-06
  name: 사용자 계정 개별 부여
  severity: 중
  category: DBMS
  remediation: 사용자별 계정 생성 및 권한 부여
  manual: true
- id: D-07
  name: root 권한으로 서비스 구동 제한
  severity: 중
  category: 계정관리
  manual: false
  remediation: DBMS 구동 계정 변경
- id: D-08
  name: 안전한 암호화 알고리즘 (SHA-2 이상; password_versions 에 12C 포함)
  severity: 상
  category: DBMS
  remediation: SHA-256 이상의 암호화 알고리즘 적용
  manual: false
- id: D-09
  name: 로그인 실패 잠금 (DEFAULT 프로파일 FAILED_LOGIN_ATTEMPTS)
  severity: 중
  category: DBMS
  remediation: 로그인 시도 횟수 제한 값 설정
  manual: false
- id: D-10
  name: 원격에서 DB 서버로의 접속 제한
  severity: 상
  category: 접근관리
  manual: false
  remediation: DB 서버에 대해 지정된 IP주소에서만 접근 가능하도록 설정
- id: D-11
  name: 시스템 테이블 비인가 접근 제한 (가이드 쿼리)
  severity: 상
  category: DBMS
  remediation: 시스템 테이블에 일반 사용자 계정이 접근할 수 없도록 설정
  manual: false
- id: D-12
  name: 안전한 리스너 비밀번호 설정 및 사용
  severity: 상
  category: 접근관리
  manual: false
  remediation: Listener 비밀번호 설정
- id: D-13
  name: 불필요한 ODBC/OLE-DB 데이터 소스와 드라이브를 제거하여 사용
  severity: 중
  category: 접근관리
  manual: false
  remediation: 불필요한 ODBC/OLE-DB 제거
- id: D-14
  name: 데이터베이스의 주요 설정 파일, 비밀번호 파일 등과 같은 주요 파일들의 접근 권한 설정
  severity: 중
  category: 접근관리
  manual: false
  remediation: 주요 설정 파일 및 디렉터리의 권한 설정 변경
- id: D-15
  name: 관리자 이외의 사용자가 오라클 리스너의 접속을 통해 리스너 로그 및 trace 파일에 대한 변경 제한
  severity: 하
  category: 접근관리
  manual: false
  remediation: 주요 파일 및 로그 파일에 대한 권한을 관리자로 제한
- id: D-16
  name: Windows 인증 모드 사용
  severity: 하
  category: 접근관리
  manual: false
  remediation: Windows 인증 모드 사용
- id: D-17
  name: Audit Table(AUD$) 접근 제한
  severity: 하
  category: DBMS
  remediation: Audit Table 접근 권한을 관리자 계정으로 제한
  manual: false
- id: D-18
  name: DBA Role 이 PUBLIC 에 부여되지 않을 것
  severity: 상
  category: DBMS
  remediation: DBA 계정의 Role 설정에서 Public 그룹 권한 취소
  manual: false
- id: D-19
  name: OS_ROLES / REMOTE_OS_AUTHENT / REMOTE_OS_ROLES = FALSE
  severity: 상
  category: DBMS
  remediation: OS_ROLES, REMOTE_OS_AUTHENTICATION, REMOTE_OS_ROLES 설정을 FALSE로 변경
  manual: false
- id: D-20
  name: 인가되지 않은 Object Owner 제한 (가이드 쿼리)
  severity: 하
  category: DBMS
  remediation: Object Owner를 SYS, SYSTEM, 관리자 계정으로 제한 설정
  manual: false
- id: D-21
  name: 인가되지 않은 GRANT OPTION 제한 (가이드 쿼리)
  severity: 중
  category: DBMS
  remediation: WITH_GRANT_OPTION이 ROLE에 의하여 설정되도록 변경
  manual: false
- id: D-22
  name: RESOURCE_LIMIT = TRUE
  severity: 하
  category: DBMS
  remediation: RESOURCE_LIMIT 설정을 TRUE로 설정 변경
  manual: false
- id: D-23
  name: xp_cmdshell 사용 제한
  severity: 상
  category: 옵션관리
  manual: false
  remediation: xp_cmdshell 설정 값을 0 또는 False로 설정
- id: D-24
  name: Registry Procedure 권한 제한
  severity: 상
  category: 옵션관리
  manual: false
  remediation: guest/public에게 부여된 시스템 확장 저장 프로시저 권한 제거
- id: D-25
  name: 보안 패치/버전
  severity: 상
  category: DBMS
  remediation: 보안 패치가 적용된 버전으로 업데이트
