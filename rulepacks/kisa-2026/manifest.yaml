rules:
- id: D-01
  name: 기본 계정의 비밀번호/정책 변경
  severity: 상
  category: DBMS
  remediation: 기본(관리자) 계정의 초기 비밀번호 및 권한 정책 변경
- id: D-02
  name: 불필요(데모/샘플) 계정 제거
  severity: 상
  category: DBMS
  remediation: 계정별 용도를 파악한 후 불필요한 계정 삭제
- id: D-03
  name: 비밀번호 사용기간/복잡도 (DEFAULT 프로파일 기준)
  severity: 상
  category: DBMS
  remediation: 기관 정책에 맞게 비밀번호 사용 기간 및 복잡도 정책 설정
- id: D-04
  name: DBA(관리자) 권한 최소화
  severity: 상
  category: DBMS
  remediation: 관리자 권한이 필요한 계정 및 그룹에만 관리자 권한 부여
- id: D-05
  name: 비밀번호 재사용 제약 (DEFAULT 프로파일)
  severity: 중
  category: DBMS
  remediation: PASSWORD_REUSE_TIME, PASSWORD_REUSE_MAX 파라미터 설정
- id: D-06
  name: 사용자 계정 개별 부여
  severity: 중
  category: DBMS
  remediation: 사용자별 계정 생성 및 권한 부여
- id: D-08
  name: 안전한 암호화 알고리즘 (SHA-2 이상; password_versions 에 12C 포함)
  severity: 상
  category: DBMS
  remediation: SHA-256 이상의 암호화 알고리즘 적용
- id: D-09
  name: 로그인 실패 잠금 (DEFAULT 프로파일 FAILED_LOGIN_ATTEMPTS)
  severity: 중
  category: DBMS
  remediation: 로그인 시도 횟수 제한 값 설정
- id: D-11
  name: 시스템 테이블 비인가 접근 제한 (가이드 쿼리)
  severity: 상
  category: DBMS
  remediation: 시스템 테이블에 일반 사용자 계정이 접근할 수 없도록 설정
- id: D-17
  name: Audit Table(AUD$) 접근 제한
  severity: 하
  category: DBMS
  remediation: Audit Table 접근 권한을 관리자 계정으로 제한
- id: D-18
  name: DBA Role 이 PUBLIC 에 부여되지 않을 것
  severity: 상
  category: DBMS
  remediation: DBA 계정의 Role 설정에서 Public 그룹 권한 취소
- id: D-19
  name: OS_ROLES / REMOTE_OS_AUTHENT / REMOTE_OS_ROLES = FALSE
  severity: 상
  category: DBMS
  remediation: OS_ROLES, REMOTE_OS_AUTHENTICATION, REMOTE_OS_ROLES 설정을 FALSE로 변경
- id: D-20
  name: 인가되지 않은 Object Owner 제한 (가이드 쿼리)
  severity: 하
  category: DBMS
  remediation: Object Owner를 SYS, SYSTEM, 관리자 계정으로 제한 설정
- id: D-21
  name: 인가되지 않은 GRANT OPTION 제한 (가이드 쿼리)
  severity: 중
  category: DBMS
  remediation: WITH_GRANT_OPTION이 ROLE에 의하여 설정되도록 변경
- id: D-22
  name: RESOURCE_LIMIT = TRUE
  severity: 하
  category: DBMS
  remediation: RESOURCE_LIMIT 설정을 TRUE로 설정 변경
- id: D-25
  name: 보안 패치/버전
  severity: 상
  category: DBMS
  remediation: 보안 패치가 적용된 버전으로 업데이트
- id: D-26
  name: 감사 기록 설정 (audit_trail / Unified Auditing)
  severity: 상
  category: DBMS
  remediation: DBMS에 대한 감사 로그 저장 정책 수립, 적용
- id: U-01
  name: root 계정 원격 접속 제한
  severity: 상
  category: Unix
  remediation: 원격 접속 시 root 계정으로 접속할 수 없도록 파일 내용 설정
- id: U-02
  name: 비밀번호 관리정책 설정
  severity: 상
  category: Unix
  remediation: root 계정을 포함한 사용자 계정의 비밀번호를 영문, 숫자, 특수문자를 포함하여 최소 8자리 이상 및 최소 사용 기간 1일, 최대 사용 기간 90일, 최근 비밀번호 기억 4회 이상으로 설정
- id: U-03
  name: 계정 잠금 임계값 설정
  severity: 상
  category: Unix
  remediation: 계정 잠금 임계값을 10회 이하로 설정
- id: U-04
  name: 비밀번호 파일 보호
  severity: 상
  category: Unix
  remediation: 비밀번호 암호화 저장·관리 설정
- id: U-05
  name: root 이외의 UID 0 금지
  severity: 상
  category: Unix
  manual: false
  remediation: ŸUID가 0으로 설정된 계정을 0 이외의 중복되지 않은 UID로 변경 또는 불필요한 계정인 경우 제거하도록 설정Ÿ(사용 중인 계정인 경우 명령어를 통한 조치가 적용되지 않을 수 있으므로 /etc/passwd
    파일을 통해 변경)
- id: U-06
  name: 사용자 계정 su 기능 제한
  severity: 상
  category: Unix
  remediation: PAM 모듈 설정 또는 su 명령어 허용 그룹 생성 후 su 명령어 일반 사용자 권한 제거하도록 설정
- id: U-07
  name: 불필요한 계정 제거
  severity: 하
  category: Unix
  manual: false
  remediation: 시스템에 존재하는 계정 확인 후 불필요한 계정 제거하도록 설정
