  severity: ''
  category: WEB
  remediation: 불필요한 스크립트 매핑 존재 여부 점검 및 제거 설정
- id: WEB-16
  name: 헤더 정보 노출 (Connector server= / showServerInfo=false)
  severity: ''
  category: WEB
  remediation: 응답 헤더에 표시되는 정보를 최소한으로 제한하여 설정
- id: WEB-17
  name: 가상 디렉터리 (Context path)
  severity: ''
  category: WEB
  remediation: 불필요한 가상 디렉터리 존재 여부 점검 및 삭제하도록 설정
- id: WEB-18
  name: WebDAV 비활성화 (Dav On)
  severity: ''
  category: WEB
  remediation: WebDAV 서비스 비활성화 설정
- id: WEB-19
  name: SSI 사용 제한
  severity: ''
  category: WEB
  remediation: 웹 서비스 내 불필요한 SSI 사용 제한 설정
- id: WEB-20
  name: SSL/TLS 활성화
  severity: ''
  category: WEB
  remediation: 웹 서비스 내 SSL/TLS 활성화 설정
- id: WEB-21
  name: HTTP->HTTPS 리디렉션
  severity: ''
  category: WEB
  remediation: HTTP Redirection 활성화 설정
- id: WEB-22
  name: 에러 페이지 관리
  severity: ''
  category: WEB
  remediation: 필수 에러 코드에 대해 일원화된 에러 페이지 사용 및 에러 페이지 내 불필요 정보 노출 제한 설정
- id: WEB-23
  name: LDAP digest 알고리즘
  severity: ''
  category: WEB
  remediation: LDAP 연결 인증 시 SHA-256 이상의 알고리즘을 사용하도록 설정
- id: WEB-24
  name: 별도 업로드 경로 - 수동
  severity: ''
  category: WEB
  remediation: 기본 경로가 아닌 별도의 업로드 경로를 지정하고, 해당 경로에 대한 일반 사용자의 접근 권한을 제한하도록 설정
- id: WEB-25
  name: 패치/버전 - 수동
  severity: ''
  category: WEB
  remediation: 패치 적용에 따른 서비스 영향 정도를 정확히 파악하여 주기적인 패치 적용 정책 수립 및 적용하도록 설정
- id: WEB-26
  name: 로그 디렉터리/파일 권한
  severity: ''
  category: WEB
  remediation: 로그 디렉터리 및 파일에 일반 사용자 접근 권한 제거 설정
